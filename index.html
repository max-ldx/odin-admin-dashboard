<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Maximilien Ledoux</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=geist:400,900" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-title">
                <img src="./assets/icons/layout-dashboard.svg" alt="Layout dashboard icon" width="32" height="32">
                <h1>Dashboard</h1>
            </div>
            <div class="sidebar-navigation">
                <div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/house.svg" alt="House icon" width="24" height="24">
                        <p>Home</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/id-card.svg" alt="ID card icon" width="24" height="24">
                        <p>Profile</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/message-square.svg" alt="Message icon" width="24" height="24">
                        <p>Messages</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/rotate-ccw-clock.svg" alt="Clock icon" width="24" height="24">
                        <p>History</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/sticky-notes.svg" alt="Sticky notes icon" width="24" height="24">
                        <p>Tasks</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/users-round.svg" alt="Users icon" width="24" height="24">
                        <p>Communities</p>
                    </div>
                </div>
                <div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/settings.svg" alt="Settings icon" width="24" height="24">
                        <p>Settings</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/circle-question-mark.svg" alt="Question mark icon" width="24"
                            height="24">
                        <p>Support</p>
                    </div>
                    <div class="sidebar-item">
                        <img src="./assets/icons/user-shield.svg" alt="User shield icon" width="24" height="24">
                        <p>Privacy</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="header">
            <div class="header-top-row">
                <img src="./assets/icons/search.svg" alt="Search icon" width="24" height="24">
                <input type="search" name="search" id="search">
                <img src="./assets/icons/bell-ring.svg" alt="Bell ringing icon" width="24" height="24">
                <img src="./assets/icons/circle-user-round.svg" alt="User account icon" width="32" height="32">
                <div class="header-user-name">John Doe</div>
            </div>
            <div class="header-bottom-row">
                <img src="./assets/icons/circle-user-round.svg" alt="User account icon" width="64" height="64">
                <div class="welcome-text">
                    <p>Hi there,</p>
                    <p class="welcome-text-user-name">John Doe (@john)</p>
                </div>
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
        <div class="main-content"></div>
    </div>
</body>

</html>
