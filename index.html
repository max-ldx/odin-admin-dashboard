<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Maximilien Ledoux</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=roboto-flex:400" rel="stylesheet" />
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-title">
            <img src="./assets/icons/layout-dashboard.svg" alt="Layout dashboard icon" width="48" height="48">

        </div>
        <div class="sidebar-nav">
            <div class="sidebar-nav-item">
                <img src="./assets/icons/house.svg" alt="House icon" width="24" height="24">

            </div>
            <div class="sidebar-nav-item">
                <img src="./assets/icons/id-card.svg" alt="ID card icon" width="24" height="24">
                <p>Profile</p>
            </div>
            <div class="sidebar-nav-item">
                <img src="./assets/icons/message-square.svg" alt="Messages icon" width="24" height="24">

            </div>

                <img src="./assets/icons/sticky-notes.svg" alt="Sticky notes icon" width="24" height="24">

            </div>
            <div class="sidebar-nav-item">
                <img src="./assets/icons/users-round.svg" alt="Users icon" width="24" height="24">

            </div>
        </div>
        <div class="sidebar-nav">
            <div class="sidebar-nav-item">
                <img src="./assets/icons/settings.svg" alt="Settings icon" width="24" height="24">
                <p>Settings</p>
            </div>
            <div class="sidebar-nav-item">
                <img src="./assets/icons/circle-question-mark.svg" alt="Question mark icon" width="24" height="24">
                <p>Support</p>
            </div>
            <div class="sidebar-nav-item">
                <img src="./assets/icons/user-shield.svg" alt="User shield icon" width="24" height="24">
                <p>Privacy</p>
            </div>
        </div>

    <header class="header">

    </header>
    <main class="main">

    </main>

</html>
